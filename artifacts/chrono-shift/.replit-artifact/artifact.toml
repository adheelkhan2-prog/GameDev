kind = "web"
previewPath = "/"
title = "CHRONO SHIFT"
version = "1.0.0"
id = "artifacts/chrono-shift"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19976

[services.development]
run = "pnpm --filter @workspace/chrono-shift run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chrono-shift", "run", "build" ]
publicDir = "artifacts/chrono-shift/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19976"
BASE_PATH = "/"
