<!-- index.html - CHRONO SHIFT Game Starter Template -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO SHIFT - Time Manipulation Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            background: #222;
            border: 4px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // ============================================
        // CHRONO SHIFT - GAME CONFIG & SCENES
        // ============================================

        // Game Configuration
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            },
            scene: [BootScene, MenuScene, Level1Scene, GameOverScene, VictoryScene]
        };

        const game = new Phaser.Game(config);

        // ============================================
        // SCENE 1: BOOT SCENE (Loading)
        // ============================================
        class BootScene extends Phaser.Scene {
            constructor() {
                super('BootScene');
            }

            preload() {
                // Loading bar
                let width = this.cameras.main.width;
                let height = this.cameras.main.height;
                let progressBar = this.add.graphics();
                let progressBox = this.add.graphics();
                progressBox.fillStyle(0x222222, 0.8);
                progressBox.fillRect(width / 2 - 160, height / 2 - 30, 320, 60);

                this.load.on('progress', (value) => {
                    progressBar.clear();
                    progressBar.fillStyle(0x00ff00, 1);
                    progressBar.fillRect(width / 2 - 150, height / 2 - 20, 300 * value, 40);
                });

                this.load.on('complete', () => {
                    progressBar.destroy();
                    progressBox.destroy();
                });

                // In a real project, load your sprites here
                // this.load.image('player', 'assets/player.png');
                // this.load.image('platform', 'assets/platform.png');
            }

            create() {
                this.scene.start('MenuScene');
            }
        }

        // ============================================
        // SCENE 2: MENU SCENE
        // ============================================
        class MenuScene extends Phaser.Scene {
            constructor() {
                super('MenuScene');
            }

            create() {
                let width = this.cameras.main.width;
                let height = this.cameras.main.height;

                // Background
                this.cameras.main.setBackgroundColor('#001a33');

                // Title
                this.add.text(width / 2, 100, 'CHRONO SHIFT', {
                    fontSize: '80px',
                    fontStyle: 'bold',
                    fill: '#00ffff',
                    fontFamily: 'Arial',
                    stroke: '#0088ff',
                    strokeThickness: 3
                }).setOrigin(0.5, 0.5);

                // Subtitle
                this.add.text(width / 2, 180, 'A Time Manipulation Puzzle Game', {
                    fontSize: '24px',
                    fill: '#ffff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5);

                // Play Button
                let playBtn = this.add.text(width / 2, 350, '[ PLAY GAME ]', {
                    fontSize: '40px',
                    fill: '#00ff00',
                    fontFamily: 'Arial',
                    fontStyle: 'bold'
                }).setOrigin(0.5, 0.5).setInteractive();

                playBtn.on('pointerover', () => {
                    playBtn.setScale(1.2);
                    playBtn.setFill('#ffff00');
                });

                playBtn.on('pointerout', () => {
                    playBtn.setScale(1);
                    playBtn.setFill('#00ff00');
                });

                playBtn.on('pointerdown', () => {
                    this.scene.start('Level1Scene');
                });

                // Instructions Button
                let instructBtn = this.add.text(width / 2, 450, '[ INSTRUCTIONS ]', {
                    fontSize: '32px',
                    fill: '#00ff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5).setInteractive();

                instructBtn.on('pointerover', () => {
                    instructBtn.setScale(1.2);
                    instructBtn.setFill('#ffff00');
                });

                instructBtn.on('pointerout', () => {
                    instructBtn.setScale(1);
                    instructBtn.setFill('#00ff00');
                });

                instructBtn.on('pointerdown', () => {
                    alert('CHRONO SHIFT CONTROLS:\n\n' +
                        'Arrow Keys / A,D - Move left/right\n' +
                        'Space - Jump\n' +
                        'E - Time Slow (5 sec, 3 sec cooldown)\n' +
                        'R - Time Rewind (2 sec, 4 sec cooldown)\n\n' +
                        'Collect all gold crystals to exit level!\n' +
                        'Avoid enemies and spikes!');
                });

                // Game Info
                this.add.text(width / 2, 600, 'Unique Time-Manipulation Gameplay | Project 3 - DUT PBDV301', {
                    fontSize: '14px',
                    fill: '#888888',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5);
            }
        }

        // ============================================
        // SCENE 3: LEVEL 1 SCENE (Main Gameplay)
        // ============================================
        class Level1Scene extends Phaser.Scene {
            constructor() {
                super('Level1Scene');
                this.score = 0;
                this.health = 3;
                this.crystalsCollected = 0;
                this.crystalsNeeded = 5;
                this.timeslowActive = false;
                this.timeslowCooldown = false;
                this.rewindActive = false;
                this.rewindCooldown = false;
            }

            create() {
                // Background
                this.cameras.main.setBackgroundColor('#001a33');

                // Create platforms (simple rectangles)
                this.platforms = this.physics.add.staticGroup();
                
                // Ground
                this.platforms.create(640, 700, null)
                    .setScale(2).refreshBody()
                    .setFillStyle(0x00aa00);

                // Platform 1
                this.platforms.create(150, 600, null)
                    .setScale(1).refreshBody()
                    .setFillStyle(0x00aa00);

                // Platform 2
                this.platforms.create(500, 500, null)
                    .setScale(1).refreshBody()
                    .setFillStyle(0x00aa00);

                // Platform 3
                this.platforms.create(900, 400, null)
                    .setScale(1).refreshBody()
                    .setFillStyle(0x00aa00);

                // Create Player (simple square)
                this.player = this.physics.add.sprite(100, 600, null);
                this.player.setFillStyle(0x00ffff);
                this.player.setBounce(0.2);
                this.player.setCollideWorldBounds(true);
                this.physics.add.collider(this.player, this.platforms);

                // Create Collectibles (Crystals)
                this.crystals = this.physics.add.group();
                const crystalPositions = [
                    { x: 150, y: 550 },
                    { x: 500, y: 450 },
                    { x: 900, y: 350 },
                    { x: 300, y: 350 },
                    { x: 1100, y: 500 }
                ];
                crystalPositions.forEach(pos => {
                    let crystal = this.crystals.create(pos.x, pos.y, null);
                    crystal.setFillStyle(0xffff00);
                    crystal.setScale(0.6);
                    crystal.setBounce(0.3);
                });
                this.physics.add.overlap(this.player, this.crystals, this.collectCrystal, null, this);

                // Create Enemies (simple red squares)
                this.enemies = this.physics.add.group();
                let enemy1 = this.enemies.create(400, 450, null);
                enemy1.setFillStyle(0xff0000);
                enemy1.setVelocityX(100);
                enemy1.setBounce(1);
                enemy1.setCollideWorldBounds(true);

                this.physics.add.collider(this.player, this.enemies, this.hitEnemy, null, this);

                // Input
                this.cursors = this.input.keyboard.createCursorKeys();
                this.wasd = {
                    A: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A),
                    D: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D),
                };

                // Abilities
                this.input.keyboard.on('keydown-E', () => this.activateTimeSlow());
                this.input.keyboard.on('keydown-R', () => this.activateTimeRewind());

                // UI
                this.levelText = this.add.text(20, 20, 'LEVEL 1', { fontSize: '24px', fill: '#00ff00' });
                this.scoreText = this.add.text(20, 50, 'SCORE: 0', { fontSize: '20px', fill: '#ffff00' });
                this.healthText = this.add.text(20, 80, 'HEALTH: ❤️❤️❤️', { fontSize: '20px', fill: '#ff0000' });
                this.crystalText = this.add.text(1100, 20, 'CRYSTALS: 0/5', { fontSize: '20px', fill: '#ffff00' });
                
                this.slowStatusText = this.add.text(20, 120, '[E] TIME SLOW - READY', { fontSize: '16px', fill: '#0088ff' });
                this.rewindStatusText = this.add.text(20, 150, '[R] TIME REWIND - READY', { fontSize: '16px', fill: '#0088ff' });

                // Exit (goal)
                this.exit = this.physics.add.sprite(1200, 600, null);
                this.exit.setFillStyle(0xff00ff);
                this.exit.setScale(1.5);
                this.physics.add.overlap(this.player, this.exit, this.levelComplete, null, this);
            }

            update() {
                // Player movement
                if (this.cursors.left.isDown || this.wasd.A.isDown) {
                    this.player.setVelocityX(-200);
                } else if (this.cursors.right.isDown || this.wasd.D.isDown) {
                    this.player.setVelocityX(200);
                } else {
                    this.player.setVelocityX(0);
                }

                // Jump
                if ((this.cursors.space.isDown || this.input.keyboard.addKey('W').isDown) && this.player.body.touching.down) {
                    this.player.setVelocityY(-300);
                }

                // Enemy patrol
                this.enemies.children.entries.forEach(enemy => {
                    if (enemy.x > 500) enemy.setVelocityX(-100);
                    if (enemy.x < 300) enemy.setVelocityX(100);
                });

                // Update UI
                this.scoreText.setText('SCORE: ' + this.score);
                this.crystalText.setText('CRYSTALS: ' + this.crystalsCollected + '/5');
                this.healthText.setText('HEALTH: ' + '❤️'.repeat(Math.max(0, this.health)));
            }

            collectCrystal(player, crystal) {
                crystal.destroy();
                this.crystalsCollected++;
                this.score += 100;
                
                if (this.crystalsCollected >= this.crystalsNeeded) {
                    this.slowStatusText.setText('ALL CRYSTALS COLLECTED! Reach exit!');
                }
            }

            hitEnemy(player, enemy) {
                this.health--;
                if (this.health <= 0) {
                    this.scene.start('GameOverScene', { score: this.score });
                } else {
                    player.setPosition(100, 600);
                    player.setVelocity(0, 0);
                }
            }

            activateTimeSlow() {
                if (!this.timeslowActive && !this.timeslowCooldown) {
                    this.timeslowActive = true;
                    this.timeslowCooldown = true;
                    this.slowStatusText.setText('[E] TIME SLOW - ACTIVE (5s)');
                    
                    this.time.timeScale = 0.2;
                    
                    this.time.delayedCall(5000 / 0.2, () => {
                        this.time.timeScale = 1;
                        this.timeslowActive = false;
                        this.slowStatusText.setText('[E] TIME SLOW - COOLDOWN (3s)');
                        
                        this.time.delayedCall(3000, () => {
                            this.timeslowCooldown = false;
                            this.slowStatusText.setText('[E] TIME SLOW - READY');
                        });
                    });
                }
            }

            activateTimeRewind() {
                if (!this.rewindActive && !this.rewindCooldown) {
                    this.rewindActive = true;
                    this.rewindCooldown = true;
                    this.rewindStatusText.setText('[R] TIME REWIND - ACTIVE (2s)');
                    
                    // Rewind effect (simple implementation)
                    this.enemies.children.entries.forEach(enemy => {
                        if (enemy.x > 500) {
                            this.tweens.add({
                                targets: enemy,
                                x: enemy.x - 100,
                                duration: 2000
                            });
                        }
                    });
                    
                    this.time.delayedCall(2000, () => {
                        this.rewindActive = false;
                        this.rewindStatusText.setText('[R] TIME REWIND - COOLDOWN (4s)');
                        
                        this.time.delayedCall(4000, () => {
                            this.rewindCooldown = false;
                            this.rewindStatusText.setText('[R] TIME REWIND - READY');
                        });
                    });
                }
            }

            levelComplete(player, exit) {
                if (this.crystalsCollected >= this.crystalsNeeded) {
                    this.scene.start('VictoryScene', { score: this.score, level: 1 });
                }
            }
        }

        // ============================================
        // SCENE 4: GAME OVER SCENE
        // ============================================
        class GameOverScene extends Phaser.Scene {
            constructor() {
                super('GameOverScene');
            }

            init(data) {
                this.finalScore = data.score || 0;
            }

            create() {
                let width = this.cameras.main.width;
                let height = this.cameras.main.height;
                this.cameras.main.setBackgroundColor('#330000');

                this.add.text(width / 2, 150, 'GAME OVER', {
                    fontSize: '80px',
                    fill: '#ff0000',
                    fontFamily: 'Arial',
                    fontStyle: 'bold'
                }).setOrigin(0.5, 0.5);

                this.add.text(width / 2, 280, 'FINAL SCORE: ' + this.finalScore, {
                    fontSize: '40px',
                    fill: '#ffff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5);

                let retryBtn = this.add.text(width / 2, 400, '[ RETRY LEVEL ]', {
                    fontSize: '36px',
                    fill: '#00ff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5).setInteractive();

                retryBtn.on('pointerdown', () => {
                    this.scene.start('Level1Scene');
                });

                let menuBtn = this.add.text(width / 2, 500, '[ MAIN MENU ]', {
                    fontSize: '36px',
                    fill: '#00ff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5).setInteractive();

                menuBtn.on('pointerdown', () => {
                    this.scene.start('MenuScene');
                });
            }
        }

        // ============================================
        // SCENE 5: VICTORY SCENE
        // ============================================
        class VictoryScene extends Phaser.Scene {
            constructor() {
                super('VictoryScene');
            }

            init(data) {
                this.finalScore = data.score || 0;
                this.level = data.level || 1;
            }

            create() {
                let width = this.cameras.main.width;
                let height = this.cameras.main.height;
                this.cameras.main.setBackgroundColor('#003300');

                this.add.text(width / 2, 150, 'LEVEL COMPLETE!', {
                    fontSize: '80px',
                    fill: '#00ff00',
                    fontFamily: 'Arial',
                    fontStyle: 'bold'
                }).setOrigin(0.5, 0.5);

                this.add.text(width / 2, 280, 'SCORE: ' + this.finalScore, {
                    fontSize: '40px',
                    fill: '#ffff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5);

                let nextBtn = this.add.text(width / 2, 400, '[ NEXT LEVEL ]', {
                    fontSize: '36px',
                    fill: '#00ff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5).setInteractive();

                nextBtn.on('pointerdown', () => {
                    if (this.level >= 3) {
                        alert('GAME COMPLETE! You beat all levels!\n\nFinal Score: ' + this.finalScore);
                        this.scene.start('MenuScene');
                    } else {
                        this.scene.start('Level1Scene');
                    }
                });

                let menuBtn = this.add.text(width / 2, 500, '[ MAIN MENU ]', {
                    fontSize: '36px',
                    fill: '#00ff00',
                    fontFamily: 'Arial'
                }).setOrigin(0.5, 0.5).setInteractive();

                menuBtn.on('pointerdown', () => {
                    this.scene.start('MenuScene');
                });
            }
        }
    </script>
</body>
</html>
